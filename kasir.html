<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Pelayan & Kasir - Moodboard Cafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar-brand {
            color: #7e210c !important;
        }
        .order-card {
            border-left: 5px solid #7e210c;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center" href="#">
                <i class="bi bi-cup-hot-fill me-2" style="color: #7e210c;"></i> Moodboard Cafe - Panel Kasir
            </a>
            <button class="btn btn-outline-danger btn-sm" id="clearAllBtn">
                <i class="bi bi-trash"></i> Hapus Semua Riwayat
            </button>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold" style="color: #7e210c;">Daftar Pesanan Masuk (Real-time)</h3>
            <span class="badge bg-secondary" id="totalOrderBadge">0 Pesanan</span>
        </div>

        <!-- Wadah List Pesanan -->
        <div class="row g-4" id="orderListContainer">
            <!-- Data Pesanan Tampil Di Sini -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCftURd2SMm6QMdegu-yL35twa4n-97xr8",
            authDomain: "moodboard-cafe.firebaseapp.com",
            databaseURL: "https://moodboard-cafe-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "moodboard-cafe",
            storageBucket: "moodboard-cafe.firebasestorage.app",
            messagingSenderId: "111496652935",
            appId: "1:111496652935:web:51b411235bc1624ebcf022",
            measurementId: "G-ENYMZFSZGM"
        };

        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Keamanan PIN Kasir
        document.addEventListener('DOMContentLoaded', () => {
            const pinRahasia = "09876"; 
            const inputPin = prompt("Masukkan PIN Kasir untuk mengakses halaman ini:");

            if (inputPin !== pinRahasia) {
                alert("PIN salah! Anda akan dikembalikan ke halaman utama.");
                window.location.href = "index.html";
                return;
            }

            const orderListContainer = document.getElementById('orderListContainer');
            const totalOrderBadge = document.getElementById('totalOrderBadge');
            const clearAllBtn = document.getElementById('clearAllBtn');

            // Membaca data secara Real-time dari Firebase Database
            database.ref('orders').on('value', (snapshot) => {
                const data = snapshot.val();
                orderListContainer.innerHTML = '';

                if (!data) {
                    totalOrderBadge.textContent = "0 Pesanan";
                    orderListContainer.innerHTML = `
                        <div class="col-12 text-center py-5 text-muted">
                            <i class="bi bi-inbox fs-1"></i>
                            <p class="mt-2">Belum ada pesanan masuk.</p>
                        </div>
                    `;
                    return;
                }

                const orderKeys = Object.keys(data);
                totalOrderBadge.textContent = `${orderKeys.length} Pesanan`;

                // Render daftar pesanan (dibalik agar yang terbaru di atas)
                orderKeys.reverse().forEach((key) => {
                    const order = data[key];
                    
                    let itemsHtml = '';
                    if (order.items) {
                        order.items.forEach(item => {
                            itemsHtml += `
                                <li class="d-flex justify-content-between text-secondary small py-1 border-bottom">
                                    <span>${item.name} <strong>x${item.qty}</strong></span>
                                    <span>Rp ${(item.price * item.qty).toLocaleString('id-ID')}</span>
                                </li>
                            `;
                        });
                    }

                    const isDineIn = order.orderType === 'Dine-in' || order.orderType === 'Makan di Tempat';
                    const orderTypeLabel = isDineIn ? 'Makan di Tempat' : 'Bawa Pulang';
                    const badgeType = isDineIn ? 'bg-primary' : 'bg-warning text-dark';
                    const statusBadge = order.status === 'Selesai' ? 'bg-success' : 'bg-danger';
                    const paymentInfo = order.paymentMethod ? `<small class="text-muted d-block mt-1">Pembayaran: <strong>${order.paymentMethod}</strong></small>` : '';

                    const col = document.createElement('div');
                    col.className = 'col-md-6 col-lg-4';
                    col.innerHTML = `
                        <div class="card shadow-sm rounded-4 border-0 order-card">
                            <div class="card-header bg-white d-flex justify-content-between align-items-center pt-3 border-0">
                                <div>
                                    <small class="text-muted d-block">${order.time || ''}</small>
                                </div>
                                <div>
                                    <span class="badge ${badgeType}">${orderTypeLabel}</span>
                                    <span class="badge ${statusBadge}">${order.status}</span>
                                </div>
                            </div>
                            <div class="card-body pt-1">
                                <div class="mb-2">
                                    <strong>Pemesan:</strong> ${order.customerName} <br>
                                    ${isDineIn ? `<strong>No. Meja:</strong> <span class="fs-5 fw-bold text-danger">${order.tableNumber}</span>` : '<em>(Bawa Pulang)</em>'}
                                    ${paymentInfo}
                                </div>

                                <div class="bg-light p-2 rounded-3 mb-3">
                                    <div class="fw-semibold small mb-1">Rincian Menu:</div>
                                    <ul class="list-unstyled mb-0">
                                        ${itemsHtml}
                                    </ul>
                                </div>

                                <div class="d-flex justify-content-between align-items-center fw-bold fs-6 mb-3">
                                    <span>Total:</span>
                                    <span style="color: #7e210c;">Rp ${order.totalAmount.toLocaleString('id-ID')}</span>
                                </div>

                                <div class="d-flex gap-2">
                                    ${order.status !== 'Selesai' ? 
                                        `<button class="btn btn-success btn-sm w-100 rounded-pill btn-complete" data-key="${key}">
                                            <i class="bi bi-check-circle me-1"></i> Tandai Selesai
                                         </button>` : 
                                        `<button class="btn btn-secondary btn-sm w-100 rounded-pill" disabled>
                                            <i class="bi bi-check-all me-1"></i> Selesai
                                         </button>`
                                    }
                                    <button class="btn btn-outline-danger btn-sm rounded-circle btn-delete" data-key="${key}">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    orderListContainer.appendChild(col);
                });

                // Tombol Tandai Selesai
                document.querySelectorAll('.btn-complete').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const key = e.currentTarget.getAttribute('data-key');
                        const paymentMethod = prompt("Pilih metode pembayaran (Tunai / QRIS / Transfer):", "Tunai");
                        if (paymentMethod) {
                            database.ref('orders/' + key).update({
                                status: 'Selesai',
                                paymentMethod: paymentMethod
                            });
                        }
                    });
                });

                // Tombol Hapus Pesanan Satuan
                document.querySelectorAll('.btn-delete').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        if (confirm('Apakah Anda yakin ingin menghapus pesanan ini?')) {
                            const key = e.currentTarget.getAttribute('data-key');
                            database.ref('orders/' + key).remove();
                        }
                    });
                });
            });

            // Tombol Hapus Semua Riwayat
            clearAllBtn.addEventListener('click', () => {
                if (confirm('Apakah Anda yakin ingin menghapus seluruh data pesanan di database?')) {
                    database.ref('orders').remove();
                }
            });
        });
    </script>
</body>
</html>
